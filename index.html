<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<title>Second Brain</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface2: #f2f2f7;
  --ink: #000000;
  --ink2: #3c3c43;
  --ink3: #8e8e93;
  --ink4: #c7c7cc;
  --sep: rgba(60,60,67,0.12);
  --sep2: rgba(60,60,67,0.2);
  --accent: #007aff;
  --red: #ff3b30;
  --orange: #ff9500;
  --green: #34c759;
  --yellow: #ffcc00;
  --purple: #af52de;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 34px);
  --nav-h: 83px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --ink: #ffffff;
    --ink2: #ebebf5cc;
    --ink3: #ebebf599;
    --ink4: #ebebf54d;
    --sep: rgba(84,84,88,0.6);
    --sep2: rgba(84,84,88,0.8);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, 'SF Pro Display', BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--ink); overscroll-behavior: none; }

/* APP SHELL */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }

/* STATUS BAR SPACE */
.status-space { height: var(--safe-top); background: var(--surface); flex-shrink: 0; }

/* HEADER */
.header { background: var(--surface); padding: 0 20px 12px; flex-shrink: 0; border-bottom: 0.5px solid var(--sep); }
.header-inner { display: flex; align-items: flex-end; justify-content: space-between; }
.header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; color: var(--ink); line-height: 1; }
.header h2 { font-size: 17px; font-weight: 600; color: var(--ink); }
.header-right { display: flex; gap: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); border: none; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; color: var(--accent); font-weight: 600; }

/* SCROLL CONTENT */
.scroll-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + 16px); }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(249,249,249,0.94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: 0.5px solid var(--sep); display: flex; align-items: flex-start; padding-top: 10px; z-index: 100; }
@media (prefers-color-scheme: dark) {
  .bottom-nav { background: rgba(28,28,30,0.94); }
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 2px 0; border: none; background: none; }
.nav-icon { font-size: 22px; line-height: 1; transition: transform .1s; }
.nav-label { font-size: 10px; font-weight: 500; color: var(--ink3); transition: color .15s; }
.nav-item.active .nav-label { color: var(--accent); }
.nav-item:active .nav-icon { transform: scale(0.88); }

/* CAPTURE / VOICE SCREEN */
.capture-screen { background: var(--bg); }
.voice-hero { display: flex; flex-direction: column; align-items: center; padding: 32px 24px 24px; gap: 20px; }
.voice-ring-outer { width: 140px; height: 140px; border-radius: 50%; background: rgba(0,122,255,0.08); display: flex; align-items: center; justify-content: center; position: relative; }
.voice-ring-outer.recording { animation: ring-pulse 1.5s infinite; }
.voice-ring-outer.recording::before { content:''; position:absolute; inset:-10px; border-radius:50%; border:2px solid rgba(0,122,255,0.3); animation: ring-expand 1.5s infinite; }
.voice-ring-outer.recording::after { content:''; position:absolute; inset:-22px; border-radius:50%; border:1.5px solid rgba(0,122,255,0.15); animation: ring-expand 1.5s .3s infinite; }
@keyframes ring-pulse { 0%,100%{background:rgba(0,122,255,0.08)} 50%{background:rgba(0,122,255,0.14)} }
@keyframes ring-expand { 0%{opacity:.8;transform:scale(1)} 100%{opacity:0;transform:scale(1.2)} }
.voice-btn-main { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 4px 24px rgba(0,122,255,0.4); transition: all .15s; }
.voice-btn-main:active { transform: scale(0.94); box-shadow: 0 2px 12px rgba(0,122,255,0.3); }
.voice-btn-main.recording { background: var(--red); box-shadow: 0 4px 24px rgba(255,59,48,0.4); }
.voice-status { font-size: 17px; font-weight: 500; color: var(--ink); text-align: center; min-height: 26px; }
.voice-sub { font-size: 14px; color: var(--ink3); text-align: center; }

.transcript-card { margin: 0 16px; background: var(--surface); border-radius: var(--radius-lg); padding: 16px; min-height: 80px; }
.transcript-text { font-size: 16px; color: var(--ink); line-height: 1.5; font-style: italic; }
.transcript-placeholder { font-size: 15px; color: var(--ink4); }

.process-btn { margin: 16px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-xl); padding: 17px; width: calc(100% - 32px); font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; transition: all .15s; }
.process-btn:active { opacity: .85; transform: scale(0.98); }
.process-btn:disabled { opacity: .4; }
.process-btn.hidden { display: none; }

.or-divider { text-align: center; font-size: 13px; color: var(--ink3); margin: 4px 0; }
.text-capture { margin: 0 16px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; }
.text-capture textarea { width: 100%; min-height: 120px; padding: 14px 16px; font-size: 16px; color: var(--ink); font-family: inherit; background: transparent; border: none; outline: none; resize: none; line-height: 1.5; }
.text-capture textarea::placeholder { color: var(--ink4); }
.text-send-row { display: flex; justify-content: flex-end; padding: 8px 12px; border-top: 0.5px solid var(--sep); }
.send-btn { background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 8px 20px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }

.ai-processing { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; font-size: 15px; color: var(--ink3); }
.spinner { width: 20px; height: 20px; border: 2px solid var(--sep); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TASKS */
.section-header { padding: 28px 20px 8px; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.task-group { margin: 0 16px 8px; }
.group-label-row { display: flex; align-items: center; gap: 6px; padding: 4px 4px 8px; }
.group-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.task-list { background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; }
.task-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 0.5px solid var(--sep); position: relative; transition: background .1s; }
.task-row:last-child { border-bottom: none; }
.task-row:active { background: var(--surface2); }
.task-chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--sep2); background: transparent; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 1px; transition: all .15s; }
.task-chk.checked { background: var(--green); border-color: var(--green); color: white; font-size: 13px; }
.task-body { flex: 1; min-width: 0; }
.task-text { font-size: 16px; color: var(--ink); line-height: 1.4; }
.task-row.done-row .task-text { text-decoration: line-through; color: var(--ink3); }
.task-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }
.chip-urgent { background: rgba(255,59,48,.12); color: var(--red); }
.chip-high { background: rgba(255,149,0,.12); color: var(--orange); }
.chip-medium { background: rgba(0,122,255,.1); color: var(--accent); }
.chip-low { background: rgba(52,199,89,.1); color: var(--green); }
.chip-proj { background: var(--surface2); color: var(--ink3); }
.chip-date { background: var(--surface2); color: var(--ink3); }
.task-del { width: 32px; height: 32px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; flex-shrink: 0; margin-top: -2px; }

/* MATRIX */
.matrix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px; }
.matrix-quad { background: var(--surface); border-radius: var(--radius-lg); padding: 14px; }
.mq-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.mq-sub { font-size: 10px; color: var(--ink3); margin-bottom: 10px; }
.mq-item { font-size: 12px; color: var(--ink2); padding: 4px 0; border-bottom: 0.5px solid var(--sep); line-height: 1.3; }
.mq-item:last-child { border-bottom: none; }
.mq-empty { font-size: 12px; color: var(--ink4); font-style: italic; }

/* EMPTY */
.empty-block { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 32px; gap: 12px; text-align: center; }
.empty-emoji { font-size: 52px; }
.empty-title { font-size: 20px; font-weight: 600; color: var(--ink); }
.empty-body { font-size: 15px; color: var(--ink3); line-height: 1.5; }

/* PROJECTS LIST */
.projects-list { margin: 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.proj-row { background: var(--surface); display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius); cursor: pointer; }
.proj-row:active { background: var(--surface2); }
.proj-icon { font-size: 22px; }
.proj-name { font-size: 16px; font-weight: 500; flex: 1; }
.proj-cnt { font-size: 15px; color: var(--ink3); }
.proj-chev { color: var(--ink4); font-size: 18px; }

/* TOAST */
.toast { position: fixed; top: calc(var(--safe-top) + 60px); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.82); color: #fff; font-size: 14px; font-weight: 500; padding: 10px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999; white-space: nowrap; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.toast.show { opacity: 1; }

/* INSET LIST STYLE */
.inset-list { margin: 0 16px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; }
.inset-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 0.5px solid var(--sep); cursor: pointer; }
.inset-row:last-child { border-bottom: none; }
.inset-row:active { background: var(--surface2); }
.inset-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.inset-label { flex: 1; font-size: 16px; color: var(--ink); }
.inset-cnt { font-size: 15px; color: var(--ink3); margin-right: 4px; }
.inset-chev { color: var(--ink4); font-size: 13px; }
</style>
</head>
<body>
<div class="app">

<!-- ══════════════ SCREEN: CAPTURE ══════════════ -->
<div class="screen active" id="screen-capture">
  <div class="status-space" style="background:var(--bg);"></div>
  <div class="header" style="background:var(--bg);border:none;">
    <div class="header-inner">
      <div>
        <h1>Захват</h1>
        <div style="font-size:13px;color:var(--ink3);margin-top:2px;">Надиктуйте или напишите задачи</div>
      </div>
    </div>
  </div>
  <div class="scroll-content">
    <!-- Voice -->
    <div class="voice-hero">
      <div class="voice-ring-outer" id="voice-ring">
        <button class="voice-btn-main" id="voice-btn" onclick="toggleVoice()">🎤</button>
      </div>
      <div class="voice-status" id="voice-status">Нажмите чтобы говорить</div>
      <div class="voice-sub" id="voice-sub">Можно надиктовать несколько задач сразу</div>
    </div>

    <!-- Transcript -->
    <div class="transcript-card" id="transcript-card">
      <div class="transcript-placeholder" id="transcript-placeholder">Здесь появится текст вашей речи...</div>
      <div class="transcript-text" id="transcript-text" style="display:none;"></div>
    </div>

    <!-- Process button -->
    <button class="process-btn hidden" id="process-voice-btn" onclick="processInput('voice')">
      <span>🧠</span> Разобрать задачи с ИИ
    </button>

    <!-- AI processing indicator -->
    <div class="ai-processing" id="ai-processing" style="display:none;">
      <div class="spinner"></div>
      <span>ИИ разбирает задачи...</span>
    </div>

    <div class="or-divider">— или напишите —</div>

    <!-- Text input -->
    <div class="text-capture">
      <textarea id="text-input" placeholder="Напишите одну или несколько задач. ИИ сам определит приоритет, проект и срок."></textarea>
      <div class="text-send-row">
        <button class="send-btn" onclick="processInput('text')">Отправить</button>
      </div>
    </div>
    <div style="height:16px;"></div>
  </div>
</div>

<!-- ══════════════ SCREEN: TODAY ══════════════ -->
<div class="screen" id="screen-today">
  <div class="status-space"></div>
  <div class="header">
    <div class="header-inner">
      <div>
        <h1>Сегодня</h1>
        <div style="font-size:13px;color:var(--ink3);margin-top:2px;" id="today-date">—</div>
      </div>
    </div>
  </div>
  <div class="scroll-content" id="today-content"></div>
</div>

<!-- ══════════════ SCREEN: ALL TASKS ══════════════ -->
<div class="screen" id="screen-tasks">
  <div class="status-space"></div>
  <div class="header">
    <div class="header-inner">
      <div>
        <h1 id="tasks-title">Задачи</h1>
        <div style="font-size:13px;color:var(--ink3);margin-top:2px;" id="tasks-sub">—</div>
      </div>
    </div>
  </div>
  <div class="scroll-content" id="tasks-content"></div>
</div>

<!-- ══════════════ SCREEN: MATRIX ══════════════ -->
<div class="screen" id="screen-matrix">
  <div class="status-space"></div>
  <div class="header">
    <div class="header-inner">
      <div>
        <h1>Матрица</h1>
        <div style="font-size:13px;color:var(--ink3);margin-top:2px;">По Эйзенхауэру</div>
      </div>
    </div>
  </div>
  <div class="scroll-content" id="matrix-content"></div>
</div>

<!-- ══════════════ SCREEN: PROJECTS ══════════════ -->
<div class="screen" id="screen-projects">
  <div class="status-space"></div>
  <div class="header">
    <div class="header-inner">
      <div>
        <h1>Проекты</h1>
        <div style="font-size:13px;color:var(--ink3);margin-top:2px;" id="proj-sub">—</div>
      </div>
    </div>
  </div>
  <div class="scroll-content" id="projects-content"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item" onclick="switchScreen('capture')">
    <span class="nav-icon">🎤</span>
    <span class="nav-label" id="nl-capture">Захват</span>
  </button>
  <button class="nav-item active" onclick="switchScreen('today')">
    <span class="nav-icon">☀️</span>
    <span class="nav-label" id="nl-today">Сегодня</span>
  </button>
  <button class="nav-item" onclick="switchScreen('tasks')">
    <span class="nav-icon">📋</span>
    <span class="nav-label" id="nl-tasks">Задачи</span>
  </button>
  <button class="nav-item" onclick="switchScreen('matrix')">
    <span class="nav-icon">🎯</span>
    <span class="nav-label" id="nl-matrix">Матрица</span>
  </button>
  <button class="nav-item" onclick="switchScreen('projects')">
    <span class="nav-icon">📁</span>
    <span class="nav-label" id="nl-projects">Проекты</span>
  </button>
</div>

</div><!-- app -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════
//  DATA
// ═══════════════════════════
let tasks = [];
let currentScreen = 'today';

function load() {
  try { tasks = JSON.parse(localStorage.getItem('sb2_tasks') || '[]'); } catch(e) { tasks = []; }
}
function save() {
  localStorage.setItem('sb2_tasks', JSON.stringify(tasks));
}
load();

// ═══════════════════════════
//  NAVIGATION
// ═══════════════════════════
function switchScreen(name) {
  currentScreen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const idx = ['capture','today','tasks','matrix','projects'].indexOf(name);
  document.querySelectorAll('.nav-item')[idx].classList.add('active');
  renderScreen(name);
}

function renderScreen(name) {
  if (name === 'today') renderToday();
  else if (name === 'tasks') renderTasks('all');
  else if (name === 'matrix') renderMatrix();
  else if (name === 'projects') renderProjects();
}

// ═══════════════════════════
//  VOICE
// ═══════════════════════════
let recognition = null;
let isRecording = false;
let voiceTranscript = '';

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('Откройте в Safari на iPhone');
    return;
  }
  if (isRecording) stopVoice();
  else startVoice();
}

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('voice-btn').classList.add('recording');
    document.getElementById('voice-btn').textContent = '⏹';
    document.getElementById('voice-ring').classList.add('recording');
    document.getElementById('voice-status').textContent = 'Слушаю...';
    document.getElementById('voice-sub').textContent = 'Нажмите снова чтобы остановить';
    document.getElementById('transcript-placeholder').style.display = 'none';
    document.getElementById('transcript-text').style.display = 'block';
    document.getElementById('transcript-text').textContent = '...';
  };
  recognition.onresult = (e) => {
    let interim = ''; voiceTranscript = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) voiceTranscript += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('transcript-text').textContent = voiceTranscript + interim;
  };
  recognition.onend = () => {
    isRecording = false;
    document.getElementById('voice-btn').classList.remove('recording');
    document.getElementById('voice-btn').textContent = '🎤';
    document.getElementById('voice-ring').classList.remove('recording');
    if (voiceTranscript.trim()) {
      document.getElementById('voice-status').textContent = 'Готово!';
      document.getElementById('voice-sub').textContent = 'Нажмите кнопку ниже чтобы ИИ разобрал задачи';
      document.getElementById('process-voice-btn').classList.remove('hidden');
    } else {
      document.getElementById('voice-status').textContent = 'Нажмите чтобы говорить';
      document.getElementById('voice-sub').textContent = 'Можно надиктовать несколько задач сразу';
      document.getElementById('transcript-placeholder').style.display = 'block';
      document.getElementById('transcript-text').style.display = 'none';
    }
  };
  recognition.onerror = () => { stopVoice(); showToast('Ошибка. Проверьте доступ к микрофону'); };
  recognition.start();
}

function stopVoice() {
  if (recognition) recognition.stop();
}

// ═══════════════════════════
//  AI PROCESSING
// ═══════════════════════════
async function processInput(source) {
  const raw = source === 'voice'
    ? voiceTranscript.trim()
    : document.getElementById('text-input').value.trim();
  if (!raw) { showToast('Нет текста'); return; }

  document.getElementById('ai-processing').style.display = 'flex';
  document.getElementById('process-voice-btn').disabled = true;
  document.querySelectorAll('.send-btn').forEach(b => b.disabled = true);

  const today = new Date().toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric'});

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `Ты — умный планировщик задач. Пользователь надиктовал текст с задачами. Разбери и извлеки все задачи.
Для каждой задачи определи:
- task: чёткая формулировка (до 80 символов)
- priority: "urgent" (срочно+важно), "high" (важно,не срочно), "medium" (срочно,не важно), "low" (не срочно,не важно)
- project: к какому проекту (если видно) или "Личное"
- due: срок ДД.ММ.ГГГГ или null
- notes: детали до 60 символов или null
Сегодня: ${today}.
Верни ТОЛЬКО JSON массив без markdown. Пример:
[{"task":"Позвонить Кабирову","priority":"urgent","project":"Отрадное","due":null,"notes":"по договору Копытин"}]`,
        messages: [{role:'user',content:raw}]
      })
    });
    const data = await res.json();
    const text = data.content.map(i=>i.text||'').join('');
    const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
    parsed.forEach(t => {
      tasks.unshift({
        id: Date.now() + Math.random(),
        task: t.task, priority: t.priority||'medium',
        project: t.project||'Личное', due: t.due||null,
        notes: t.notes||null, done: false,
        created: new Date().toISOString()
      });
    });
    save();
    showToast(`✓ Добавлено: ${parsed.length} задач`);
    if (source === 'voice') {
      voiceTranscript = '';
      document.getElementById('voice-status').textContent = 'Нажмите чтобы говорить';
      document.getElementById('voice-sub').textContent = 'Можно надиктовать несколько задач сразу';
      document.getElementById('transcript-text').style.display = 'none';
      document.getElementById('transcript-placeholder').style.display = 'block';
      document.getElementById('process-voice-btn').classList.add('hidden');
    } else {
      document.getElementById('text-input').value = '';
    }
    setTimeout(() => switchScreen('today'), 600);
  } catch(e) {
    showToast('Ошибка ИИ. Попробуйте ещё раз');
    console.error(e);
  } finally {
    document.getElementById('ai-processing').style.display = 'none';
    document.getElementById('process-voice-btn').disabled = false;
    document.querySelectorAll('.send-btn').forEach(b => b.disabled = false);
  }
}

// ═══════════════════════════
//  RENDER TODAY
// ═══════════════════════════
const PC = {
  urgent:{label:'🔥 Срочно',chip:'chip-urgent',dot:'#ff3b30'},
  high:  {label:'📌 Важно', chip:'chip-high',  dot:'#ff9500'},
  medium:{label:'⏰ Срочно',chip:'chip-medium', dot:'#007aff'},
  low:   {label:'💤 Отложить',chip:'chip-low', dot:'#34c759'},
};

function getTodayList() {
  const today = new Date(); today.setHours(0,0,0,0);
  return tasks.filter(t => {
    if (t.done) return false;
    if (t.priority === 'urgent') return true;
    if (t.due) {
      const [d,m,y] = t.due.split('.');
      return new Date(y,m-1,d) <= today;
    }
    return (today - new Date(t.created)) < 86400000;
  });
}

function renderToday() {
  const list = getTodayList();
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const el = document.getElementById('today-content');
  if (!list.length) {
    el.innerHTML = `<div class="empty-block">
      <div class="empty-emoji">🌿</div>
      <div class="empty-title">Всё сделано!</div>
      <div class="empty-body">Новых задач нет. Нажмите 🎤 чтобы добавить</div>
    </div>`;
    return;
  }
  el.innerHTML = renderGroupedTasks(list);
}

function renderGroupedTasks(list) {
  const grouped = {};
  list.forEach(t => { if (!grouped[t.priority]) grouped[t.priority]=[]; grouped[t.priority].push(t); });
  const order = ['urgent','high','medium','low'];
  let html = '';
  order.forEach(p => {
    if (!grouped[p]?.length) return;
    const cfg = PC[p];
    html += `<div class="task-group">
      <div class="group-label-row">
        <span class="group-badge ${cfg.chip}" style="font-size:12px;">${cfg.label}</span>
        <span style="font-size:12px;color:var(--ink3);">${grouped[p].length}</span>
      </div>
      <div class="task-list">`;
    grouped[p].forEach(t => { html += renderTaskRow(t); });
    html += `</div></div>`;
  });
  return html;
}

function renderTaskRow(t) {
  const cfg = PC[t.priority] || PC.medium;
  const doneClass = t.done ? 'done-row' : '';
  return `<div class="task-row ${doneClass}" id="tr-${t.id}">
    <div class="task-chk ${t.done?'checked':''}" onclick="toggleDone('${t.id}')">${t.done?'✓':''}</div>
    <div class="task-body">
      <div class="task-text">${t.task}</div>
      <div class="task-chips">
        ${t.project&&t.project!=='Личное'?`<span class="chip chip-proj">📁 ${t.project}</span>`:''}
        ${t.due?`<span class="chip chip-date">📅 ${t.due}</span>`:''}
        ${t.notes?`<span class="chip chip-proj">${t.notes}</span>`:''}
      </div>
    </div>
    <button class="task-del" onclick="deleteTask('${t.id}')">🗑</button>
  </div>`;
}

// ═══════════════════════════
//  RENDER TASKS
// ═══════════════════════════
function renderTasks(filter, projectName) {
  let list = tasks.filter(t => !t.done);
  let title = 'Задачи';
  let sub = '';
  if (filter === 'project' && projectName) {
    list = tasks.filter(t => t.project === projectName && !t.done);
    title = projectName;
    sub = `${list.length} задач`;
  } else {
    sub = `${list.length} активных`;
  }
  document.getElementById('tasks-title').textContent = title;
  document.getElementById('tasks-sub').textContent = sub;
  const el = document.getElementById('tasks-content');
  if (!list.length) {
    el.innerHTML = `<div class="empty-block">
      <div class="empty-emoji">✅</div>
      <div class="empty-title">Задач нет</div>
      <div class="empty-body">Добавьте задачи через голос или текст</div>
    </div>`;
    return;
  }
  el.innerHTML = renderGroupedTasks(list);
}

// ═══════════════════════════
//  RENDER MATRIX
// ═══════════════════════════
function renderMatrix() {
  const active = tasks.filter(t => !t.done);
  const q = { urgent:[], high:[], medium:[], low:[] };
  active.forEach(t => { if (q[t.priority]) q[t.priority].push(t); });
  function items(list) {
    if (!list.length) return `<div class="mq-empty">Нет задач</div>`;
    return list.slice(0,4).map(t=>`<div class="mq-item">${t.task}</div>`).join('') +
      (list.length>4?`<div style="font-size:11px;color:var(--ink4);padding-top:4px;">+ ещё ${list.length-4}</div>`:'');
  }
  document.getElementById('matrix-content').innerHTML = `
  <div style="padding:12px 16px 8px;font-size:13px;color:var(--ink3);">Расстановка задач по важности и срочности</div>
  <div class="matrix-grid">
    <div class="matrix-quad" style="border-top:3px solid var(--red);">
      <div class="mq-title" style="color:var(--red);">🔥 Делать сейчас</div>
      <div class="mq-sub">Срочно + Важно</div>${items(q.urgent)}
    </div>
    <div class="matrix-quad" style="border-top:3px solid var(--orange);">
      <div class="mq-title" style="color:var(--orange);">📌 Запланировать</div>
      <div class="mq-sub">Важно, не срочно</div>${items(q.high)}
    </div>
    <div class="matrix-quad" style="border-top:3px solid var(--accent);">
      <div class="mq-title" style="color:var(--accent);">👥 Делегировать</div>
      <div class="mq-sub">Срочно, не важно</div>${items(q.medium)}
    </div>
    <div class="matrix-quad" style="border-top:3px solid var(--green);">
      <div class="mq-title" style="color:var(--green);">💤 Отложить</div>
      <div class="mq-sub">Не срочно, не важно</div>${items(q.low)}
    </div>
  </div>
  <div style="padding:12px 16px;">
    <div style="background:var(--surface);border-radius:var(--radius-lg);padding:14px 16px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--ink);">📊 Сводка</div>
      ${['urgent','high','medium','low'].map(p=>`
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--sep);font-size:14px;">
        <span style="color:var(--ink2);">${PC[p].label}</span>
        <span style="font-weight:600;color:var(--ink);">${q[p].length}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

// ═══════════════════════════
//  RENDER PROJECTS
// ═══════════════════════════
function renderProjects() {
  const active = tasks.filter(t => !t.done);
  const projects = [...new Set(active.map(t => t.project))];
  const doneCnt = tasks.filter(t => t.done).length;
  document.getElementById('proj-sub').textContent = `${projects.length} проектов`;
  const el = document.getElementById('projects-content');
  let html = `<div style="height:8px;"></div>`;

  html += `<div class="inset-list">`;
  html += `<div class="inset-row" onclick="showAllTasks()">
    <div class="inset-icon" style="background:rgba(0,122,255,.1);">📋</div>
    <div class="inset-label">Все задачи</div>
    <span class="inset-cnt">${active.length}</span><span class="inset-chev">›</span>
  </div>`;
  html += `<div class="inset-row" onclick="showUrgent()">
    <div class="inset-icon" style="background:rgba(255,59,48,.1);">🔥</div>
    <div class="inset-label">Срочные</div>
    <span class="inset-cnt">${active.filter(t=>t.priority==='urgent').length}</span><span class="inset-chev">›</span>
  </div>`;
  html += `<div class="inset-row" onclick="showDone()">
    <div class="inset-icon" style="background:rgba(52,199,89,.1);">✅</div>
    <div class="inset-label">Выполненные</div>
    <span class="inset-cnt">${doneCnt}</span><span class="inset-chev">›</span>
  </div>`;
  html += `</div>`;

  if (projects.length) {
    html += `<div style="padding:20px 20px 8px;font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;">Проекты</div>`;
    html += `<div class="inset-list">`;
    projects.forEach(p => {
      const cnt = active.filter(t=>t.project===p).length;
      html += `<div class="inset-row" onclick="showProject('${p}')">
        <div class="inset-icon" style="background:rgba(175,82,222,.1);">📁</div>
        <div class="inset-label">${p}</div>
        <span class="inset-cnt">${cnt}</span><span class="inset-chev">›</span>
      </div>`;
    });
    html += `</div>`;
  }

  el.innerHTML = html;
}

function showAllTasks() { switchScreen('tasks'); renderTasks('all'); }
function showUrgent() {
  switchScreen('tasks');
  const list = tasks.filter(t=>!t.done&&t.priority==='urgent');
  document.getElementById('tasks-title').textContent = '🔥 Срочные';
  document.getElementById('tasks-sub').textContent = `${list.length} задач`;
  document.getElementById('tasks-content').innerHTML = list.length ? renderGroupedTasks(list) : `<div class="empty-block"><div class="empty-emoji">🎉</div><div class="empty-title">Нет срочных!</div><div class="empty-body">Отличная работа</div></div>`;
}
function showDone() {
  switchScreen('tasks');
  const list = tasks.filter(t=>t.done);
  document.getElementById('tasks-title').textContent = '✅ Выполненные';
  document.getElementById('tasks-sub').textContent = `${list.length} завершено`;
  document.getElementById('tasks-content').innerHTML = list.length ? renderGroupedTasks(list) : `<div class="empty-block"><div class="empty-emoji">📋</div><div class="empty-title">Ничего нет</div><div class="empty-body">Завершённые задачи появятся здесь</div></div>`;
}
function showProject(name) { switchScreen('tasks'); renderTasks('project', name); }

// ═══════════════════════════
//  ACTIONS
// ═══════════════════════════
function toggleDone(id) {
  const t = tasks.find(x => String(x.id) === String(id));
  if (!t) return;
  t.done = !t.done;
  if (t.done) t.doneAt = new Date().toISOString();
  save();
  if (t.done) showToast('✓ Выполнено!');
  renderScreen(currentScreen);
}

function deleteTask(id) {
  if (!confirm('Удалить задачу?')) return;
  tasks = tasks.filter(x => String(x.id) !== String(id));
  save();
  renderScreen(currentScreen);
  showToast('Удалено');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ═══════════════════════════
//  INIT
// ═══════════════════════════
switchScreen('today');
</script>
